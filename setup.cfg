[tool:pytest]
DJANGO_SETTINGS_MODULE = bookstore.settings_sqlite
python_files = tests/*.py tests/**/*.py
addopts = -v --tb=short

[flake8]
max-line-length = 119
exclude =
    venv,
    .venv,
    migrations,
    staticfiles,
    htmlcov,
    .git,
    __pycache__,
    .eggs,
    *.egg-info
per-file-ignores =
    # Дозволяємо wildcard imports у settings
    bookstore/settings/*.py:F401,F403,F405
ignore =
    # W503: line break before binary operator (конфліктує з black)
    W503,
    # E501: line too long (контролюється max-line-length)
    E501
