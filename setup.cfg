[tool:pytest]
DJANGO_SETTINGS_MODULE = bookstore.settings_sqlite
python_files = tests/*.py tests/**/*.py
addopts = -v --tb=short

[flake8]
max-line-length = 119
exclude =
    venv,
    .venv,
    migrations,
    staticfiles,
    htmlcov,
    .git,
    __pycache__,
    .eggs,
    *.egg-info
per-file-ignores =
    # Дозволяємо wildcard imports у settings
    bookstore/settings/*.py:F401,F403,F405
ignore =
    ignore =
    W503,
    E501,
    E402,
    F401,
    F811,
    F841