{% extends "base.html" %}
{% block title %}My profile{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 m-0">My profile</h1>
  <a class="btn btn-outline-dark btn-sm" href="{% url 'accounts:profile_edit' %}">Edit</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <dl class="row mb-0">
      <dt class="col-sm-4">Username</dt>
      <dd class="col-sm-8">{{ request.user.username }}</dd>

      <dt class="col-sm-4">Email</dt>
      <dd class="col-sm-8">{{ request.user.email|default:"—" }}</dd>

      <dt class="col-sm-4">Phone</dt>
      <dd class="col-sm-8">{{ request.user.profile.phone_number|default:"—" }}</dd>
    </dl>
  </div>
</div>
{% endblock %}
