<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'shop:book_list' %}">📚 BookStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'shop:book_list' %}">Books</a>
                </li>
            </ul>
            <div class="d-flex gap-2 align-items-center">
                {% if perms.shop.add_book %}
                    <a href="{% url 'shop:book_create' %}" class="btn btn-outline-light btn-sm">Add New Book</a>
                {% endif %}
                {% if request.user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-light btn-sm">
                        {{ request.user.username }}
                    </a>
                    <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm">Login</a>
                    <a href="{% url 'accounts:register' %}" class="btn btn-light btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
