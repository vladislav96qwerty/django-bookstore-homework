services:

  # ── NGINX — reverse proxy + статичні файли ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bookstore_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  # ── Django / Gunicorn ────────────────────────────────────────────────────────
  web:
    build: .
    container_name: bookstore_web
    # Замінили runserver на Gunicorn: 4 воркери, bind на 0.0.0.0:8000
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn bookstore.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120
               --access-logfile -
               --error-logfile -"
    expose:
      - "8000"       # відкриваємо лише всередині docker-мережі (nginx проксіює)
    env_file:
      - .env
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bookstore_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bookstore_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Celery Worker — виконує async tasks ──────────────────────────────────────
  celery:
    build: .
    container_name: bookstore_celery
    command: celery -A bookstore worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat — запускає periodic tasks ────────────────────────────────────
  celery-beat:
    build: .
    container_name: bookstore_celery_beat
    command: celery -A bookstore beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_started   # потрібна БД з міграціями
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
